name: Deploy MonoApp Frontend By Tag
run-name: Deploy frontend ${{ github.ref_name }}

on:
  push:
    tags:
      - 'web-v*'

permissions:
  contents: read

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      FRONTEND_API_BASE_URL: ${{ vars.FRONTEND_API_BASE_URL }}
      FRONTEND_SSO_BASE_URL: ${{ vars.FRONTEND_SSO_BASE_URL }}
      FRONTEND_AI_API_BASE_URL: ${{ vars.FRONTEND_AI_API_BASE_URL }}
      FRONTEND_MONITOR_DSN: ${{ vars.FRONTEND_MONITOR_DSN }}
      FRONTEND_TRACKING_APP_ID: ${{ vars.FRONTEND_TRACKING_APP_ID }}
      FRONTEND_API_PREFIX: ${{ vars.FRONTEND_API_PREFIX }}
      FRONTEND_OAUTH_PROVIDER: ${{ vars.FRONTEND_OAUTH_PROVIDER }}
      PORTAL_API_BASE_URL: ${{ vars.PORTAL_API_BASE_URL }}
      PORTAL_SSO_BASE_URL: ${{ vars.PORTAL_SSO_BASE_URL }}
      PORTAL_AI_API_BASE_URL: ${{ vars.PORTAL_AI_API_BASE_URL }}
      PORTAL_MONITOR_DSN: ${{ vars.PORTAL_MONITOR_DSN }}
      PORTAL_TRACKING_APP_ID: ${{ vars.PORTAL_TRACKING_APP_ID }}
      PORTAL_API_PREFIX: ${{ vars.PORTAL_API_PREFIX }}
      PORTAL_OAUTH_PROVIDER: ${{ vars.PORTAL_OAUTH_PROVIDER }}
      PORTAL_ADMIN_WEB_BASE_URL: ${{ vars.PORTAL_ADMIN_WEB_BASE_URL }}
      ADMIN_API_BASE_URL: ${{ vars.ADMIN_API_BASE_URL }}
      ADMIN_SSO_BASE_URL: ${{ vars.ADMIN_SSO_BASE_URL }}
      ADMIN_AI_API_BASE_URL: ${{ vars.ADMIN_AI_API_BASE_URL }}
      ADMIN_MONITOR_DSN: ${{ vars.ADMIN_MONITOR_DSN }}
      ADMIN_TRACKING_APP_ID: ${{ vars.ADMIN_TRACKING_APP_ID }}
      ADMIN_API_PREFIX: ${{ vars.ADMIN_API_PREFIX }}
      ADMIN_OAUTH_PROVIDER: ${{ vars.ADMIN_OAUTH_PROVIDER }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Extract tag name
        id: vars
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG_NAME" ]; then
            echo "Missing tag name"
            exit 1
          fi
          if [[ ! "$TAG_NAME" =~ ^web-v[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid frontend release tag: $TAG_NAME"
            echo "Expected format: web-v followed by letters, numbers, dots, underscores, or hyphens."
            exit 1
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.2.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Prepare app build env files
        run: node scripts/prepare-frontend-build-env.mjs

      - name: Build portal web
        run: pnpm --filter portal-web build

      - name: Build admin web
        run: pnpm --filter admin-web build

      - name: Prepare deploy package
        run: |
          set -euo pipefail
          rm -rf .deploy-package frontend.tar.gz
          mkdir -p .deploy-package/portal .deploy-package/admin
          cp -r apps/portal-web/dist/. .deploy-package/portal/
          cp -r apps/admin-web/dist/. .deploy-package/admin/
          test -f .deploy-package/portal/index.html
          test -f .deploy-package/admin/index.html
          tar -czf frontend.tar.gz -C .deploy-package .

      - name: Upload package to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: frontend.tar.gz
          target: /www/apps/frontend/shared

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            RELEASE_ID="${{ steps.vars.outputs.tag_name }}"
            APP_ROOT="/www/apps/frontend"
            RELEASE_DIR="$APP_ROOT/releases/$RELEASE_ID"
            CURRENT_DIR="$APP_ROOT/current"
            NEXT_CURRENT_DIR="$APP_ROOT/current.next"
            SHARED_DIR="$APP_ROOT/shared"

            if [ -z "$RELEASE_ID" ]; then
              echo "Missing release tag"
              exit 1
            fi
            if ! printf '%s' "$RELEASE_ID" | grep -Eq '^web-v[0-9A-Za-z._-]+$'; then
              echo "Invalid release tag: $RELEASE_ID"
              exit 1
            fi

            if [ ! -f "$SHARED_DIR/frontend.tar.gz" ]; then
              echo "Missing frontend package: $SHARED_DIR/frontend.tar.gz"
              exit 1
            fi

            mkdir -p "$RELEASE_DIR"
            find "$RELEASE_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            tar -xzf "$SHARED_DIR/frontend.tar.gz" -C "$RELEASE_DIR"

            if [ ! -f "$RELEASE_DIR/portal/index.html" ] || [ ! -f "$RELEASE_DIR/admin/index.html" ]; then
              echo "Invalid frontend package: portal/index.html and admin/index.html are required."
              exit 1
            fi

            ln -sfn "$RELEASE_DIR" "$NEXT_CURRENT_DIR"
            mv -Tf "$NEXT_CURRENT_DIR" "$CURRENT_DIR"

            CURRENT_RELEASE="$(readlink -f "$CURRENT_DIR")"
            find "$APP_ROOT/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
              | sort -rn \
              | tail -n +6 \
              | cut -d' ' -f2- \
              | while IFS= read -r OLD_RELEASE; do
                  if [ "$(readlink -f "$OLD_RELEASE")" != "$CURRENT_RELEASE" ]; then
                    rm -rf "$OLD_RELEASE"
                  fi
                done

            echo "Frontend deployed: $RELEASE_ID"
