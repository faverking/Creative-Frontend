workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

default:
  image: node:20
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .pnpm-store/

stages:
  - install
  - lint
  - typecheck
  - test
  - build
  - deploy

variables:
  PNPM_STORE_DIR: .pnpm-store
  BUILD_OUTPUT: apps/admin-web/dist

before_script:
  - corepack enable
  - pnpm config set store-dir $PNPM_STORE_DIR
  - pnpm install --frozen-lockfile

install:
  stage: install
  script:
    - pnpm -v

lint:
  stage: lint
  script:
    - pnpm lint

typecheck:
  stage: typecheck
  script:
    - pnpm typecheck

unit_test:
  stage: test
  script:
    - pnpm test

build_admin:
  stage: build
  script:
    - pnpm --filter admin-web build
  artifacts:
    expire_in: 7 days
    paths:
      - $BUILD_OUTPUT

build_packages:
  stage: build
  script:
    - pnpm -r --filter "@frontend/*" build

.deploy_template:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash openssh-client rsync
  script:
    - chmod +x scripts/deploy/deploy-web.sh
    - scripts/deploy/deploy-web.sh "$DEPLOY_TARGET"
  needs:
    - job: build_admin
      artifacts: true

deploy_test:
  extends: .deploy_template
  variables:
    DEPLOY_TARGET: test
  environment:
    name: test
    url: $TEST_DEPLOY_URL
  rules:
    - if: '$CI_COMMIT_BRANCH == "test"'
      when: on_success

deploy_prod:
  extends: .deploy_template
  variables:
    DEPLOY_TARGET: prod
  environment:
    name: production
    url: $PROD_DEPLOY_URL
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: false